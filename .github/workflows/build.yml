
name: Build PokeRogueDS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure devkitPro
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV

      - name: Install Nintendo DS libraries
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm nds-dev

      - name: Check libnds
        run: |
          ls -l /opt/devkitpro/libnds/lib/libnds9.a

      - name: Build Nintendo DS ROM
        run: make

      - name: Upload NDS
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueDS-nds
          path: "**/*.nds"
          if-no-files-found: error
          
