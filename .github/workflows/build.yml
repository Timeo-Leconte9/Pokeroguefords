name: Build NDS
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          dkp-pacman -Sy --noconfirm nds-dev || true
      - name: Compilation
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: PokeRogueDS
          path: "*.nds"
